[project]
name = "simulation-service"
version = "0.1.0"
description = "Simulation execution API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "platform-sdk",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  # M22b: safe expression evaluator for agent-generated formulas.
  # Whitelist of operators + functions; no imports / attribute access /
  # comprehensions / lambdas / dunders. CVE history is short and the
  # API surface is tiny.
  "simpleeval>=1.0.0",
  # M22b: async Postgres driver for GenericDagSim to read DB-backed
  # sector topology + formulas without bouncing through sector-service.
  "asyncpg>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulation_service"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "mypy>=1.13.0",
  "ruff>=0.7.0",
]
