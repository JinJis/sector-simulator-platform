[project]
name = "data-pipeline"
version = "0.1.0"
description = "Data ingestion service — refreshes equity quotes + FX from yfinance"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "asyncpg>=0.30.0",
  "apscheduler>=3.10.4",
  # yfinance is unofficial — fine for dev/MVP, swap for a paid source
  # (AlphaVantage / Polygon / Tiingo) when SLA-bound usage shows up.
  "yfinance>=0.2.50",
  # httpx for async HTTP (DART + EDGAR adapters in M10b).
  "httpx>=0.27.0",
  # M48→data-pipeline merger: deep_research/* fetchers + agents.py call
  # GroundedResearchClient + agent SignalExtractor. agent-tools also pulls
  # google-genai + anthropic[vertex] used by those modules.
  "agent-tools",
  # crawl4ai powers the news_ingest_5min tier (Yahoo/Naver/Finviz). It
  # pulls in playwright at runtime for JS-rendered pages.
  "crawl4ai>=0.4.0",
  # Playwright is NOT a hard dep of crawl4ai (it's behind extras in
  # 0.4.x), but the Yahoo Finance adapter actually needs JS rendering,
  # so we depend on it directly. Pin to >=1.40 to match crawl4ai's
  # tested range. The chromium browser binary is installed separately
  # by `python -m playwright install --with-deps chromium` in the
  # data-pipeline Dockerfile.
  "playwright>=1.40.0",
  # ARQ — async Redis queue (Celery-equivalent for FastAPI async code).
  # Powers the data-pipeline worker that executes fetcher jobs out-of-
  # band from the HTTP trigger. CrawlRun rows stay the durable status
  # board; ARQ holds in-flight queue + retry state in Redis.
  "arq>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_pipeline"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "mypy>=1.13.0",
  "ruff>=0.7.0",
]
