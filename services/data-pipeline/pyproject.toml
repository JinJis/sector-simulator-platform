[project]
name = "data-pipeline"
version = "0.1.0"
description = "Data ingestion service — refreshes equity quotes + FX from yfinance"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "asyncpg>=0.30.0",
  "apscheduler>=3.10.4",
  # yfinance is unofficial — fine for dev/MVP, swap for a paid source
  # (AlphaVantage / Polygon / Tiingo) when SLA-bound usage shows up.
  "yfinance>=0.2.50",
  # httpx for async HTTP (DART + EDGAR adapters in M10b).
  "httpx>=0.27.0",
  # M48→data-pipeline merger: deep_research/* fetchers + agents.py call
  # DeepResearchClient + agent SignalExtractor. agent-tools also pulls
  # google-genai + anthropic[vertex] used by those modules.
  "agent-tools",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_pipeline"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "mypy>=1.13.0",
  "ruff>=0.7.0",
]
