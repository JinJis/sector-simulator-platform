[project]
name = "crawler"
version = "0.1.0"
description = "Phase 4 — real-time crawler service. Runs per-surface fetchers + the Gemini Deep Research Agent, writes CrawlRun + Signal rows."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "asyncpg>=0.30.0",
  "httpx>=0.27.0",
  "apscheduler>=3.10.0",
  "agent-tools",
  # Commit 1 transitional dep — crawler's logic modules moved to
  # data_pipeline.{deep_research,db,agents,crawl_run_repo}. Commits
  # 2-3 inline the dispatch + collapse main.py; commit 6 deletes
  # this service entirely.
  "data-pipeline",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crawler"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "mypy>=1.13.0",
  "ruff>=0.7.0",
]
