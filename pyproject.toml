[tool.uv.workspace]
members = [
  "packages/sdk-python",
  "packages/agent-tools",
  "services/simulation-service",
  "services/agent-orchestration",
  "services/data-pipeline",
  "services/crawler",
]

[tool.uv.sources]
platform-sdk = { workspace = true }
agent-tools = { workspace = true }
data-pipeline = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
