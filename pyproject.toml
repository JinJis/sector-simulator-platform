[tool.uv.workspace]
members = ["packages/sdk-python", "services/simulation-service"]

[tool.uv.sources]
platform-sdk = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
