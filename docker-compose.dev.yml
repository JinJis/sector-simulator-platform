# Dev mode — shared dev/staging environment.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# - Builds the `prod` Dockerfile stage (no --reload, no dev deps mounted).
# - Ports exposed to host for direct probing.
# - Verbose logs. Auto-restart on crash, not on host reboot.

services:
  postgres:
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  simulation-service:
    build:
      target: prod
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: debug
      ENVIRONMENT: dev
    ports:
      - "8000:8000"
    restart: unless-stopped

  sector-service:
    build:
      target: prod
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
    ports:
      - "8001:8001"
    restart: unless-stopped

  web:
    build:
      target: prod
    environment:
      NODE_ENV: production
      # Web only ever talks to sector-service now — the browser goes through
      # the /api/sim Next.js rewrite, server-side fetch uses the
      # compose-internal hostname.
      SECTOR_SERVICE_URL: http://sector-service:8001
      ENVIRONMENT: dev
    ports:
      - "3000:3000"
    restart: unless-stopped

  admin:
    build:
      target: prod
    environment:
      NODE_ENV: production
      SECTOR_SERVICE_URL: http://sector-service:8001
      AGENT_ORCHESTRATION_URL: http://agent-orchestration:8002
      ENVIRONMENT: dev
    ports:
      - "3100:3100"
    restart: unless-stopped

volumes:
  postgres_data:
