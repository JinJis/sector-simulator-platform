[project]
name = "platform-sdk"
version = "0.1.0"
description = "Simulation SDK — SimulationBase, Driver, Output"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_sdk"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "mypy>=1.13.0",
  "ruff>=0.7.0",
]
