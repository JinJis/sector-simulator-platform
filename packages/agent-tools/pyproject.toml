[project]
name = "agent-tools"
version = "0.1.0"
description = "LLM client + MCP-style tool definitions for the agent layer"
requires-python = ">=3.12"
dependencies = [
  "google-genai>=0.20.0",
  "anthropic[vertex]>=0.40.0",
  "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_tools"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=1.0.0",
  "mypy>=1.13.0",
  "ruff>=0.7.0",
]
