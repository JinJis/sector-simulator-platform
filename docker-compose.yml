# Base Compose file — shared service definitions.
# Always combined with one of: docker-compose.local.yml / .dev.yml / .prod.yml
#
# Example:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build

name: tech-sector-simulator

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
      POSTGRES_DB: ${POSTGRES_DB:-platform_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-platform_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  simulation-service:
    image: tssp/simulation-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infra/docker/simulation-service.Dockerfile
    environment:
      # M22b: GenericDagSim loads agent-generated sectors from Postgres
      # at request time. Unset = DB-backed sims are silently disabled
      # (the in-code 3 sims still work). Container-internal hostname.
      DATABASE_URL: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform_dev}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # One-shot: apply Prisma migrations + seed the in-code sectors so the
  # `scenarios.sector_slug` FK resolves. Reuses the sector-service image
  # (it already has @platform/db installed + the prisma CLI on its PATH).
  # Idempotent — `migrate deploy` is a no-op when up to date, and the seed
  # script upserts.
  db-migrate:
    # Separate tag from sector-service so it can pin to the dev stage even
    # when sector-service itself is built as prod (see docker-compose.dev.yml).
    image: tssp/db-migrate:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infra/docker/sector-service.Dockerfile
      target: dev
    command:
      - sh
      - -c
      - "pnpm --filter @platform/db migrate:deploy && pnpm --filter @platform/db seed && pnpm --filter @platform/db seed:equities && pnpm --filter @platform/db seed:equity-quotes && pnpm --filter @platform/db seed:equity-financials"
    working_dir: /repo
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform_dev}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

  # One-shot: bootstrap graph_nodes + graph_edges from each sim's
  # Python `SimGraph` literal. Requires simulation-service to be
  # reachable (no healthcheck — we just retry inside the script).
  # Idempotent: upserts; safe to re-run.
  graph-bootstrap:
    image: tssp/db-migrate:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infra/docker/sector-service.Dockerfile
      target: dev
    command:
      - sh
      - -c
      - "echo '[graph-bootstrap] waiting 5s for simulation-service…' && sleep 5 && pnpm --filter @platform/db seed:graph && pnpm --filter @platform/db seed:graph-equities"
    working_dir: /repo
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform_dev}
      SIMULATION_SERVICE_URL: http://simulation-service:8000
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      simulation-service:
        condition: service_started
    restart: "no"
    networks:
      - internal

  agent-orchestration:
    image: tssp/agent-orchestration:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infra/docker/agent-orchestration.Dockerfile
    # Vertex / LLM env comes from .env — NOT from compose interpolation.
    # `${VAR:-default}` interpolation lets the host shell env win over the
    # .env file (compose's standard precedence), which means an
    # `export GOOGLE_CLOUD_LOCATION=us-central1` in someone's ~/.bashrc
    # would silently override the value here. `env_file:` skips
    # interpolation and injects the .env entries directly into the
    # container, so the file is the only source of truth for these.
    env_file:
      - .env
    environment:
      PROMPTS_DIR: /repo/prompts
      # Persistence: when set, workflow records survive restarts.
      # Without it the service falls back to an in-memory dict.
      DATABASE_URL: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform_dev}
      # Default for the SA JSON mount path — kept here (not in .env)
      # because the path is container-internal and shouldn't change.
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/vertex-ai-sa.json
    volumes:
      # Service-account JSON keys (read-only). Drop the file at
      # infra/secrets/vertex-ai-sa.json on the host — see
      # infra/secrets/README.md for setup. Both this service and
      # sector-service mount the same dir.
      - ./infra/secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - internal

  data-pipeline:
    image: tssp/data-pipeline:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infra/docker/data-pipeline.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform_dev}
      # `yfinance` (default) for live ingest; `fake` to short-circuit
      # to a no-op source for local smoke tests.
      INGEST_SOURCE: ${INGEST_SOURCE:-yfinance}
      # Daily refresh cron — UTC. Default 08:30 UTC (17:30 KST, after
      # KOSPI close + a few hours after US close).
      INGEST_CRON_QUOTES: ${INGEST_CRON_QUOTES:-30 8 * * *}
      # Set to `off` if you don't want the scheduler firing in CI/dev.
      INGEST_SCHEDULE: ${INGEST_SCHEDULE:-on}
      INGEST_THROTTLE_MS: ${INGEST_THROTTLE_MS:-200}
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - internal

  sector-service:
    image: tssp/sector-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infra/docker/sector-service.Dockerfile
    # See agent-orchestration above — same reasoning: Vertex env comes
    # only from .env, never from host shell interpolation.
    env_file:
      - .env
    environment:
      # Container-internal addressing — simulation-service is in the same
      # bridge network, postgres ditto.
      SIMULATION_SERVICE_URL: http://simulation-service:8000
      AGENT_ORCHESTRATION_URL: http://agent-orchestration:8002
      DATA_PIPELINE_URL: http://data-pipeline:8003
      DATABASE_URL: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform_dev}
      # Container-internal SA mount path.
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/vertex-ai-sa.json
    volumes:
      - ./infra/secrets:/secrets:ro
    depends_on:
      simulation-service:
        condition: service_started
      agent-orchestration:
        condition: service_started
      data-pipeline:
        condition: service_started
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      graph-bootstrap:
        condition: service_completed_successfully
    networks:
      - internal

  web:
    image: tssp/web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    depends_on:
      - simulation-service
      - sector-service
    networks:
      - internal

  admin:
    # Admin console — sector + scenario inspection + agent-runs.
    # Same image shape as `web` but pinned to port 3100 to avoid
    # collisions when both apps are up at once.
    image: tssp/admin:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infra/docker/admin.Dockerfile
    environment:
      # RSC / route handlers run inside the container, so address
      # sector-service / agent-orchestration by their compose hostnames
      # (not localhost). next.config.ts reads SECTOR_SERVICE_URL.
      SECTOR_SERVICE_URL: http://sector-service:8001
      AGENT_ORCHESTRATION_URL: http://agent-orchestration:8002
    depends_on:
      - sector-service
      - agent-orchestration
    networks:
      - internal

networks:
  internal:
    driver: bridge
