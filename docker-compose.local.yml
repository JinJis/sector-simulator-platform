# Local mode — hot reload.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# - Builds the `dev` Dockerfile stage.
# - Bind-mounts source so edits trigger Next.js Fast Refresh / uvicorn --reload.
# - node_modules stays on a named volume to avoid host/container ABI mismatches.

services:
  postgres:
    ports:
      # Host port 6543 → container 5432 so we don't collide with any system
      # postgresql install. Inside the compose network services still talk
      # to postgres:5432 (container-internal port is unchanged).
      - "6543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: "no"

  simulation-service:
    build:
      target: dev
    environment:
      PYTHONUNBUFFERED: "1"
      # Same as the Dockerfile's PYTHONPATH, repeated here so it survives
      # any future docker-compose env_file additions overriding it.
      PYTHONPATH: /repo/services/simulation-service:/repo/packages/sdk-python
    volumes:
      - ./services/simulation-service:/repo/services/simulation-service
      - ./packages/sdk-python:/repo/packages/sdk-python
    ports:
      - "8000:8000"
    restart: "no"

  agent-orchestration:
    build:
      target: dev
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /repo/services/agent-orchestration:/repo/packages/agent-tools:/repo/packages/sdk-python
      LOG_LEVEL: DEBUG
    volumes:
      - ./services/agent-orchestration:/repo/services/agent-orchestration
      - ./packages/agent-tools:/repo/packages/agent-tools
      - ./packages/sdk-python:/repo/packages/sdk-python
      # Bind-mount the prompts dir so edits to a system prompt are picked
      # up live (the loader's lru_cache is cleared on uvicorn --reload).
      - ./prompts:/repo/prompts:ro
    ports:
      - "8002:8002"
    restart: "no"

  data-pipeline:
    build:
      target: dev
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /repo/services/data-pipeline
      LOG_LEVEL: DEBUG
      # In local mode default to fake source — keeps `pnpm dev` from
      # hammering yfinance every restart. Flip to `yfinance` via the
      # host env when you want a real refresh.
      INGEST_SOURCE: ${INGEST_SOURCE:-fake}
      # Scheduler off by default in local — manual /jobs/refresh-quotes
      # only. Override with `INGEST_SCHEDULE=on docker compose up`.
      INGEST_SCHEDULE: ${INGEST_SCHEDULE:-off}
      # When running behind a TLS-terminating proxy that doesn't set
      # X-Forwarded-Proto (e.g., Cloud Workstation's *.proxy.googlers.com),
      # set ADMIN_FORCE_URL_SCHEME=https in .env so SQLAdmin renders
      # https:// static URLs. Leave unset for plain http://localhost.
      ADMIN_FORCE_URL_SCHEME: ${ADMIN_FORCE_URL_SCHEME:-}
    volumes:
      - ./services/data-pipeline:/repo/services/data-pipeline
    ports:
      - "8003:8003"
    restart: "no"

  # data-pipeline and data-pipeline-worker share `tssp/data-pipeline:latest`.
  # Without forcing dev here too, `docker compose up --build` would rebuild
  # the worker with the default (prod) target last, overwriting the dev
  # image data-pipeline needs — and prod's `USER app` then can't read the
  # host-owned bind mount, so the HTTP container dies with
  # `ModuleNotFoundError: data_pipeline` on boot.
  data-pipeline-worker:
    build:
      target: dev
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: DEBUG
    volumes:
      - ./services/data-pipeline:/repo/services/data-pipeline
    restart: "no"

  # Bind-mount packages/db so host edits to schema.prisma / migrations are
  # picked up without rebuilding the image. node_modules stays on a named
  # volume so the in-image linux-musl install isn't shadowed.
  db-migrate:
    volumes:
      - ./packages/db:/repo/packages/db
      - db_migrate_db_node_modules:/repo/packages/db/node_modules

  sector-service:
    build:
      target: dev
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      # tsx watch otherwise misses bind-mount file events on Docker
      # Desktop (macOS in particular). Polling is slower but reliable;
      # in pure-Linux dev environments the polling is harmless overhead.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
    volumes:
      - ./services/sector-service:/repo/services/sector-service
      - ./packages/db:/repo/packages/db
      # node_modules in named volumes so host (likely macOS) doesn't shadow
      # linux-musl binaries built during install.
      - sector_service_node_modules:/repo/services/sector-service/node_modules
      - db_node_modules:/repo/packages/db/node_modules
    ports:
      - "8001:8001"
    restart: "no"

  web:
    build:
      target: dev
    environment:
      NODE_ENV: development
      # Server-side fetch from RSC / route handlers runs inside this
      # container, so `localhost` would resolve to the container itself,
      # not the host — point at the compose-internal hostname instead.
      # Browser-side fetch goes through the `/api/sim` Next.js rewrite (see
      # apps/web/next.config.ts), which uses this same URL server-side, so
      # no `NEXT_PUBLIC_*` var is needed.
      SECTOR_SERVICE_URL: http://sector-service:8001
      # Make file watching work reliably on Docker Desktop bind mounts.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/web:/repo/apps/web
      # The web app type-imports @platform/sector-service / @platform/db
      # and runtime-imports @platform/ui. Bind-mount their sources so
      # changes to the tRPC router type / shared components surface live
      # in `next dev` without rebuilding the image.
      - ./services/sector-service:/repo/services/sector-service
      - ./packages/db:/repo/packages/db
      - ./packages/ui:/repo/packages/ui
      # tsconfig.base.json is extended by apps/web/tsconfig.json — mount
      # read-only so host edits are picked up without leaking writes.
      - ./tsconfig.base.json:/repo/tsconfig.base.json:ro
      # Keep node_modules inside the container (named volumes) so the Linux
      # binaries built during install aren't shadowed by the host mount —
      # one volume per workspace package that's bind-mounted.
      - web_node_modules:/repo/apps/web/node_modules
      - web_next_cache:/repo/apps/web/.next
      - web_sector_service_node_modules:/repo/services/sector-service/node_modules
      - web_db_node_modules:/repo/packages/db/node_modules
      - web_ui_node_modules:/repo/packages/ui/node_modules
    ports:
      - "3000:3000"
    restart: "no"

  # (M55) `admin` Next.js app was deleted — SQLAdmin at
  # data-pipeline:8003/admin replaces it. See docker-compose.yml note.

volumes:
  web_node_modules:
  web_next_cache:
  web_sector_service_node_modules:
  web_db_node_modules:
  web_ui_node_modules:
  postgres_data:
  sector_service_node_modules:
  db_node_modules:
  db_migrate_db_node_modules:
